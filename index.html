```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        background:
            radial-gradient(circle at center, #260018 0%, #10000b 45%, #030005 100%);
        color: white;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* Ambient glow */
    body::before {
        content: "";
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: #ff0055;
        filter: blur(180px);
        opacity: 0.12;
        animation: ambient 5s infinite alternate;
    }

    @keyframes ambient {
        from {
            transform: scale(0.8);
            opacity: 0.08;
        }
        to {
            transform: scale(1.2);
            opacity: 0.18;
        }
    }

    .container {
        text-align: center;
        position: relative;
        z-index: 10;
        width: 90%;
        max-width: 800px;
    }

    .small-text {
        font-size: 15px;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: #ff9cbe;
        opacity: 0;
        animation: fadeIn 2s forwards;
    }

    h1 {
        margin-top: 12px;
        font-size: clamp(45px, 9vw, 90px);
        font-weight: 800;
        letter-spacing: 3px;

        background: linear-gradient(
            90deg,
            #fff,
            #ffb6d0,
            #ff1767,
            #fff
        );
        background-size: 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        animation:
            titleGlow 5s linear infinite,
            fadeIn 2s forwards;
    }

    @keyframes titleGlow {
        0% { background-position: 0%; }
        100% { background-position: 300%; }
    }

    /* HEART */
    .heart-wrapper {
        margin: 50px auto 35px;
        width: 230px;
        height: 210px;
        position: relative;
        cursor: pointer;
        animation: appear 1.5s ease forwards;
    }

    .heart {
        position: absolute;
        width: 170px;
        height: 170px;
        left: 30px;
        top: 15px;

        background: linear-gradient(
            135deg,
            #ff0055,
            #ff174f,
            #ff4f91
        );

        transform: rotate(-45deg);

        box-shadow:
            0 0 15px #ff0055,
            0 0 35px #ff0055,
            0 0 70px #ff0055,
            0 0 120px rgba(255, 0, 85, 0.8);

        animation:
            heartbeat 1.2s infinite,
            heartColor 4s infinite alternate;
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 170px;
        height: 170px;
        border-radius: 50%;
        background: inherit;
    }

    .heart::before {
        top: -85px;
        left: 0;
    }

    .heart::after {
        top: 0;
        left: 85px;
    }

    @keyframes heartbeat {
        0%, 100% {
            transform: rotate(-45deg) scale(1);
        }

        15% {
            transform: rotate(-45deg) scale(1.12);
        }

        30% {
            transform: rotate(-45deg) scale(1);
        }

        45% {
            transform: rotate(-45deg) scale(1.08);
        }

        60% {
            transform: rotate(-45deg) scale(1);
        }
    }

    @keyframes heartColor {
        from {
            filter: hue-rotate(0deg);
        }
        to {
            filter: hue-rotate(25deg);
        }
    }

    .heart-wrapper:hover .heart {
        animation:
            heartbeat 0.5s infinite,
            heartColor 1s infinite alternate;
    }

    .message {
        min-height: 60px;
        font-size: clamp(18px, 3vw, 25px);
        color: #ffdce9;
        line-height: 1.6;
        padding: 0 20px;
    }

    .cursor {
        display: inline-block;
        width: 2px;
        height: 25px;
        background: #ff4f91;
        margin-left: 4px;
        animation: blink 0.7s infinite;
        vertical-align: middle;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    .buttons {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 13px 28px;
        border-radius: 50px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    #forgive {
        background: linear-gradient(135deg, #ff0055, #ff4f91);
        color: white;
        box-shadow: 0 0 25px rgba(255, 0, 85, 0.45);
    }

    #forgive:hover {
        transform: scale(1.08);
        box-shadow:
            0 0 20px #ff0055,
            0 0 45px #ff0055;
    }

    #notYet {
        background: rgba(255,255,255,0.08);
        color: #ffc8dc;
        border: 1px solid rgba(255,255,255,0.15);
    }

    #notYet:hover {
        transform: translateY(-3px);
    }

    /* Floating particles */
    .particle {
        position: absolute;
        bottom: -30px;
        pointer-events: none;
        animation: floatUp linear forwards;
        opacity: 0;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0) scale(0.5) rotate(0deg);
            opacity: 0;
        }

        15% {
            opacity: 0.8;
        }

        100% {
            transform:
                translateY(-110vh)
                translateX(var(--move))
                scale(1.4)
                rotate(360deg);
            opacity: 0;
        }
    }

    .success {
        position: fixed;
        inset: 0;
        background: rgba(8,0,7,0.94);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: 0.7s;
    }

    .success.show {
        opacity: 1;
        pointer-events: auto;
    }

    .success-heart {
        font-size: 120px;
        animation: successBeat 1s infinite;
        filter: drop-shadow(0 0 30px #ff1767);
    }

    @keyframes successBeat {
        50% {
            transform: scale(1.2);
        }
    }

    .success h2 {
        margin-top: 20px;
        font-size: clamp(35px, 7vw, 70px);
        background: linear-gradient(90deg, #fff, #ff4f91);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .success p {
        margin-top: 15px;
        color: #ffc7db;
        font-size: 20px;
    }

    .close {
        margin-top: 30px;
        background: #ff1767;
        color: white;
    }

    @keyframes fadeIn {
        to {
            opacity: 1;
        }
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: scale(0.4);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* Mobile */
    @media (max-width: 600px) {
        .heart-wrapper {
            transform: scale(0.8);
            margin: 25px auto;
        }

        .buttons {
            margin-top: 15px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="small-text">A little message from my heart</div>

    <h1>I'm Sorry.</h1>

    <div class="heart-wrapper" id="heart">
        <div class="heart"></div>
    </div>

    <div class="message">
        <span id="typing"></span><span class="cursor"></span>
    </div>

    <div class="buttons">
        <button id="forgive">❤️ I Forgive You</button>
        <button id="notYet">I'm Still Mad 😤</button>
    </div>

</div>

<!-- Success screen -->
<div class="success" id="success">
    <div class="success-heart">❤️</div>
    <h2>Thank You.</h2>
    <p>You just made my heart beat a little faster.</p>
    <button class="close" onclick="closeSuccess()">Come Back 💕</button>
</div>

<script>

const message =
    "I know that saying “sorry” can't magically fix everything... " +
    "but I really mean it. I never wanted to hurt you. " +
    "You mean more to me than my stupid mistakes ever could. ❤️";

const typing = document.getElementById("typing");

let index = 0;

function typeMessage() {

    if (index < message.length) {
        typing.textContent += message.charAt(index);
        index++;

        let speed = message.charAt(index - 1) === " "
            ? 25
            : 38;

        setTimeout(typeMessage, speed);
    }
}

setTimeout(typeMessage, 1800);


/* Floating hearts */
const symbols = ["❤", "♡", "✦", "♥", "·"];

function createParticle() {

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

    particle.style.left = Math.random() * 100 + "vw";

    particle.style.fontSize =
        (10 + Math.random() * 25) + "px";

    particle.style.animationDuration =
        (5 + Math.random() * 7) + "s";

    particle.style.setProperty(
        "--move",
        (Math.random() * 200 - 100) + "px"
    );

    document.body.appendChild(particle);

    setTimeout(() => {
        particle.remove();
    }, 13000);
}

setInterval(createParticle, 300);


/* Heart click */
document.getElementById("heart").addEventListener("click", () => {

    for (let i = 0; i < 20; i++) {
        setTimeout(createParticle, i * 40);
    }

});


/* Forgive button */
document.getElementById("forgive").addEventListener("click", () => {

    document.getElementById("success")
        .classList.add("show");

    for (let i = 0; i < 60; i++) {
        setTimeout(createParticle, i * 25);
    }

});


/* "Still mad" button */
const notYet = document.getElementById("notYet");

notYet.addEventListener("click", () => {

    const messages = [
        "Okay... I deserve that 😭",
        "I'll wait... 🥺",
        "Still here though ❤️",
        "I'll keep saying sorry...",
        "Okay okay... one more hug? 🫂"
    ];

    const random =
        messages[Math.floor(Math.random() * messages.length)];

    notYet.textContent = random;

    /* Make the forgive button slightly bigger */
    const forgive = document.getElementById("forgive");

    const current =
        parseFloat(getComputedStyle(forgive).fontSize);

    forgive.style.fontSize =
        Math.min(current + 2, 28) + "px";
});


function closeSuccess() {

    document.getElementById("success")
        .classList.remove("show");
}


/* Prevent accidental scrolling */
document.addEventListener("keydown", (e) => {

    if (e.code === "Space") {
        e.preventDefault();
    }

});

</script>

</body>
</html>
